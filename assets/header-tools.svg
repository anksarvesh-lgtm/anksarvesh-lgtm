<linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#86efac"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2f1a"/><stop offset="1" stop-color="#0c1a2b"/></linearGradient>
</defs>
<rect width="1000" height="78" rx="14" fill="url(#g1)"/>
