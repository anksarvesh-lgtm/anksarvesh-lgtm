<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sarvesh Yadav - Agriculturist by profession, Developer by passion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e13"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <g id="wheat">
      <path d="M0 0 C-3 -50 4 -110 0 -172" fill="none" stroke="#e6c35c" stroke-width="3" stroke-linecap="round"/>
      <g fill="#f2d675">
        <ellipse cx="-8" cy="-118" rx="4.5" ry="11" transform="rotate(-28 -8 -118)"/>
        <ellipse cx="8" cy="-123" rx="4.5" ry="11" transform="rotate(28 8 -123)"/>
        <ellipse cx="-8" cy="-138" rx="4.5" ry="11" transform="rotate(-28 -8 -138)"/>
        <ellipse cx="8" cy="-143" rx="4.5" ry="11" transform="rotate(28 8 -143)"/>
        <ellipse cx="-7" cy="-158" rx="4.5" ry="11" transform="rotate(-26 -7 -158)"/>
        <ellipse cx="7" cy="-163" rx="4.5" ry="11" transform="rotate(26 7 -163)"/>
        <ellipse cx="0" cy="-182" rx="4.5" ry="11"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1010" cy="95" r="170" fill="url(#sun)"/>

  <!-- faint code symbols -->
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="700" fill="#ffffff" opacity="0.10">
    <text x="250" y="80" font-size="64">{ }</text>
    <text x="880" y="75" font-size="56">&lt;/&gt;</text>
    <text x="150" y="215" font-size="48">#</text>
    <text x="1060" y="225" font-size="48">;</text>
  </g>

  <!-- back hill -->
  <path d="M0 320 L0 262 C220 236 420 284 640 262 C860 240 1020 276 1200 250 L1200 320 Z" fill="#1f7a3a" opacity="0.9"/>

  <!-- wheat left -->
  <use href="#wheat" transform="translate(70 300) rotate(-6) scale(1)"/>
  <use href="#wheat" transform="translate(125 302) rotate(4) scale(0.8)"/>
  <use href="#wheat" transform="translate(175 304) rotate(-3) scale(0.62)"/>

  <!-- wheat right -->
  <use href="#wheat" transform="translate(1025 304) rotate(3) scale(0.62)"/>
  <use href="#wheat" transform="translate(1075 302) rotate(-4) scale(0.8)"/>
  <use href="#wheat" transform="translate(1130 300) rotate(6) scale(1)"/>

  <!-- front hill -->
  <path d="M0 320 L0 292 C240 270 460 308 700 288 C900 272 1060 300 1200 282 L1200 320 Z" fill="#0f3d1d"/>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="150" font-size="58" font-weight="800" fill="#ffffff" text-anchor="middle">Sarvesh Yadav</text>
    <text x="580" y="198" font-size="26" font-weight="600" fill="#fde68a" text-anchor="end">Agriculturist by profession</text>
    <circle cx="600" cy="190" r="4" fill="#e5e7eb"/>
    <text x="620" y="198" font-size="26" font-weight="600" fill="#86efac" text-anchor="start">Developer by passion</text>
    <text x="600" y="238" font-size="18" fill="#cbd5e1" text-anchor="middle">Building the tools I wish existed</text>
  </g>
</svg>
